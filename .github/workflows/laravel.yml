name: Laravel

on:
  push:
    branches: [ main, features/* ]
  pull_request:
    branches: [ main ]

jobs:
  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # v2.37.2 -- Release-SHA statt Branch-Commit, damit der Pin reproduzierbar bleibt
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          coverage: none

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      # Check-only: Auto-Commits scheitern auf Dependabot-PRs am read-only
      # GITHUB_TOKEN und machen den Check nicht-deterministisch. Lokal fixen mit:
      # vendor/bin/php-cs-fixer fix
      - name: PHP-CS-Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.php --diff --dry-run --allow-risky=yes

  build-laravel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # v2.37.2 -- Release-SHA statt Branch-Commit, damit der Pin reproduzierbar bleibt
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          # composer.lock verlangt >=8.2 (symfony/string 7.2 u.a.); Laravel 9
          # supportet offiziell maximal 8.2
          php-version: '8.2'
          extensions: mbstring, dom, curl, zip, gd, pdo_sqlite, sqlite3
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # sass im Lockfile verlangt Node >=20.19; Vite 8 (PR-Pfad) >=20.19/22.12
          node-version: '22'
          cache: npm

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      # Tests laufen auf sqlite :memory: (phpunit.xml) -- kein DB-Service noetig
      - name: Execute tests (Unit and Feature tests) via PHPUnit
        run: php artisan test

      - name: Compile Assets
        run: |
          npm ci
          npm run build-prod
