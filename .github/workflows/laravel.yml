name: Laravel

on:
  push:
    branches: [main, features/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # v2.40.0 -- Release-SHA statt Branch-Commit, damit der Pin reproduzierbar bleibt
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress
          --prefer-dist

      # Check-only: Auto-Commits scheitern auf Dependabot-PRs am read-only
      # GITHUB_TOKEN und machen den Check nicht-deterministisch. Lokal fixen mit:
      # vendor/bin/php-cs-fixer fix
      - name: PHP-CS-Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.php --diff --dry-run
          --allow-risky=yes

  build-laravel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # v2.40.0 -- Release-SHA statt Branch-Commit, damit der Pin reproduzierbar bleibt
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          # Laravel 13: PHP 8.3-8.5; composer.lock ist auf Plattform 8.3.0
          # aufgeloest (config.platform.php). 8.3 und 8.5 prueft tests-php-matrix
          php-version: '8.4'
          extensions: mbstring, dom, curl, zip, gd, pdo_sqlite, sqlite3
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Node 24 LTS (Support bis 30.04.2028); Node 20 ist EOL. Untergrenze
          # siehe engines in package.json
          node-version: '24'
          cache: npm

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress
          --prefer-dist

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      # Tests laufen auf sqlite :memory: (phpunit.xml) -- kein DB-Service noetig
      - name: Execute tests (Unit and Feature tests) via PHPUnit
        run: php artisan test

      - name: Compile Assets
        run: |
          npm ci
          npm run build-prod

  # Die Server-PHP-Version ist offen: den restlichen von Laravel 13 und
  # composer.lock unterstuetzten Bereich mittesten (8.4 laeuft in build-laravel).
  # Geht ueber needs in den Required Check ci ein.
  tests-php-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@v7

      # v2.40.0 -- Release-SHA statt Branch-Commit, damit der Pin reproduzierbar bleibt
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, curl, zip, gd, pdo_sqlite, sqlite3
          coverage: none

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress
          --prefer-dist

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      # Tests laufen auf sqlite :memory: (phpunit.xml) -- kein DB-Service noetig
      - name: Execute tests (Unit and Feature tests) via PHPUnit
        run: php artisan test

  # Der Admin-Import (ConfigurationImport) leert die Tabellen mit MySQL-SQL
  # (SET FOREIGN_KEY_CHECKS) und baut seine Meldungen aus MySQL-Fehlertexten;
  # ConfigurationImportTest (Endpoint, Ersetzen, Rollback, Meldungen) wird auf
  # sqlite uebersprungen und laeuft nur hier. --fail-on-skipped: ein Skip hiesse,
  # dass diese Tests nicht gegen MySQL liefen. Geht ueber needs in den
  # Required Check ci ein.
  # Alle PHP-Versionen, weil der MySQL-Pfad nach Version verzweigt: Laravel
  # verbindet ab 8.4 per PDO::connect, config/database.php nutzt ab 8.5 Pdo\Mysql.
  tests-mysql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    # Echte Umgebungsvariablen gewinnen gegen <env> in phpunit.xml (ohne force)
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v7

      # v2.40.0 -- Release-SHA statt Branch-Commit, damit der Pin reproduzierbar bleibt
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, curl, zip, gd, pdo_sqlite, sqlite3, pdo_mysql
          coverage: none

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress
          --prefer-dist

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Execute tests (Unit and Feature tests) via PHPUnit against MySQL
        run: php artisan test --fail-on-skipped

  # Standard aus https://github.com/supsign/.github: einziger Required-Status-
  # Check im Branch-Schutz. In `needs` stehen alle Jobs dieser Datei.
  ci:
    name: ci
    if: always()
    needs: [php-cs-fixer, build-laravel, tests-php-matrix, tests-mysql]
    runs-on: ubuntu-latest
    steps:
      - name: Ein Job ist rot oder abgebrochen
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "Alle Jobs gruen."

  # Zentrale Dependabot-Automatik, startet nur bei gruenem ci.
  dependabot:
    needs: ci
    # Pflicht: ohne if prueft das implizite success() alle Vorgaenger-Jobs, ein uebersprungener reicht und dependabot laeuft trotz gruenem ci nicht.
    if: ${{ !cancelled() && needs.ci.result == 'success' }}
    uses: supsign/.github/.github/workflows/dependabot.yml@main
    permissions:
      contents: write
      pull-requests: write
