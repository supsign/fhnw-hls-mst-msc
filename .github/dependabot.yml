version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    # Neue Releases erst nach ein paar Tagen aufgreifen, damit zurueckgezogene
    # oder sofort nachgepatchte Versionen gar nicht erst einen PR ausloesen.
    cooldown:
      default-days: 7
    commit-message:
      # prefix bewusst nur 'build': include:scope ergaenzt '(deps)' bzw.
      # '(deps-dev)' selbst. Mit prefix 'build(deps)' wuerde daraus
      # 'build(deps)(deps): ...'.
      prefix: build
      prefix-development: build
      include: scope
    groups:
      # Alle offenen Security-Advisories in einen PR statt in je einen.
      composer-security:
        applies-to: security-updates
        patterns:
          - '*'
      # Patch und Minor bewusst in GETRENNTEN Gruppen: fetch-metadata meldet
      # pro PR nur das hoechste Update im Bundle, und die Auto-Merge-Policy
      # (.github/workflows/dependabot-auto-merge.yml) merged nur patch. Eine
      # gemischte Gruppe war dadurch fast immer "minor" und blieb liegen.
      composer-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - patch
      composer-minor:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
    # Major-Updates werden bewusst NICHT gruppiert und NICHT auto-gemergt --
    # die bleiben einzelne PRs mit manuellem Review.

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
      # Getrennte patch/minor-Gruppen aus demselben Grund wie bei composer.
      npm-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - patch
      npm-minor:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Zurich
    open-pull-requests-limit: 3
    # github-actions unterstuetzt nur default-days -- die semver-*-Keys werden
    # von Dependabot als ungueltig abgelehnt und blockieren die ganze Config.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      # Getrennte patch/minor-Gruppen aus demselben Grund wie bei composer.
      github-actions-patch:
        patterns:
          - '*'
        update-types:
          - patch
      github-actions-minor:
        patterns:
          - '*'
        update-types:
          - minor
